<head>

<title>Тренер</title>
<meta name="description" content="Персональный журнал тренировок, питания и веса">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренер">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>

/* ============================================================
   1. ТОКЕНЫ. Светлая — в :root, тёмная переопределяет только
   переменные. Цветов внутри медиазапросов нет, тема ставится
   атрибутом data-theme из JS.
   ============================================================ */
:root{
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#EDEFF2;
  --surface-3:#E4E7EB;
  --line:#DFE3E8;
  --line-2:#C9D0D8;
  --ink:#0E1114;
  --ink-2:#4B555F;
  --ink-3:#7C868F;
  --accent:#B4E019;          /* заливка: кнопки, активное, прогресс */
  --accent-ink:#0E1114;      /* текст поверх заливки */
  --accent-soft:#EDF7CE;     /* подложка */
  --accent-text:#4A6300;     /* тот же тон, но с контрастом для текста */
  --info:#2F6DD0;
  --good:#1F9D5B;
  --warn:#A16E00;
  --bad:#CE3B33;
  --overlay:rgba(14,17,20,.4);
  --lift:0 1px 2px rgba(14,17,20,.06);

  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;

  --r:10px;
  --r-s:7px;
  --pad:14px;
  --topbar:52px;
  --tabbar:58px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0C0E;
  --surface:#131619;
  --surface-2:#1A1E22;
  --surface-3:#242930;
  --line:#22272C;
  --line-2:#333A42;
  --ink:#F2F4F6;
  --ink-2:#A7B0B9;
  --ink-3:#727C86;
  --accent:#C8F73C;
  --accent-ink:#0B0C0E;
  --accent-soft:#20290A;
  --accent-text:#C8F73C;
  --info:#6BA5FF;
  --good:#3FD68C;
  --warn:#FFC24B;
  --bad:#FF6259;
  --overlay:rgba(0,0,0,.66);
  --lift:none;
  color-scheme:dark;
}

/* ============================================================
   2. БАЗА
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-ui);font-size:14px;line-height:1.45;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.2}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
a{color:var(--info)}
svg{display:block}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-ink)}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.dim{color:var(--ink-3)}
.mid{color:var(--ink-2)}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   3. ОБОЛОЧКА: одна вкладка — один экран
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:30;
  height:calc(var(--topbar) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) var(--pad) 0;
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
/* кнопка темы в шапке — крупнее и с запасом от края экрана */
.topbar .iconbtn{width:38px;height:38px}
.topbar .ttl{font-size:16px;font-weight:600;letter-spacing:-.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-family:var(--f-num);font-size:11px;color:var(--ink-3);white-space:nowrap}
.iconbtn{
  width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-s);color:var(--ink-2);border:1px solid transparent;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.sm{width:28px;height:28px}
.iconbtn.sm svg{width:15px;height:15px}
.iconbtn.danger:hover{color:var(--bad)}

.wrap{max-width:1180px;margin:0 auto;display:block}
.rail{display:none}
.screen{display:none;padding:14px var(--pad) calc(var(--tabbar) + 26px + env(safe-area-inset-bottom))}
.screen.on{display:block}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:var(--tabbar);color:var(--ink-3);font-size:10px;font-weight:500;letter-spacing:0;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button[aria-current=true]{color:var(--ink)}
.tabbar button[aria-current=true] svg{color:var(--accent-text)}

/* ============================================================
   4. БЛОКИ
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:10px;box-shadow:var(--lift)}
.card.tight{padding:10px 12px}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.card > h3{margin-bottom:10px}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* кнопки */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:0 14px;border-radius:var(--r-s);
  background:var(--surface-2);border:1px solid var(--line-2);
  font-size:14px;font-weight:500;letter-spacing:-.01em;text-align:center;
  transition:background .12s,border-color .12s,transform .07s;
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.big{min-height:50px;font-size:16px;width:100%;font-weight:600}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* поля */
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:11px;font-weight:500;color:var(--ink-3)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:8px 10px;width:100%;min-height:38px;font-size:14px;
  font-family:var(--f-num);font-variant-numeric:tabular-nums;
}
input[type=text],input[type=search],textarea,select{font-family:var(--f-ui)}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{border-color:var(--accent-text);outline:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;gap:2px}
.seg button{padding:5px 10px;font-size:12px;font-weight:500;border-radius:5px;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
:root[data-theme="dark"] .seg button[aria-pressed=true]{background:var(--surface-3);color:var(--ink)}

.toggle{width:42px;height:24px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.toggle[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-pressed=true]::after{transform:translateX(18px);background:var(--accent-ink)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.swrow:last-child{border-bottom:0}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.pill.good{background:transparent;color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.pill.warn{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.pill.bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.note{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-s);
  background:var(--surface-2);font-size:13px;color:var(--ink-2);margin-bottom:10px}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--ink-3)}
.note.acc{background:var(--accent-soft);color:var(--accent-text)}
.note.acc svg{color:var(--accent-text)}
.note.warn{background:transparent;box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
.note.warn svg{color:var(--warn)}
.note .x{margin-left:auto;flex:none}

/* ============================================================
   5. ГЛАВНАЯ КАРТОЧКА ДНЯ
   ============================================================ */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--lift)}
.hero .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.hero .day{font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.hero .meta{font-size:13px;color:var(--ink-3);margin-top:3px}
.hero .mark{width:44px;height:44px;flex:none;border-radius:var(--r-s);background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:17px;font-weight:600;color:var(--accent-text)}

/* плотная сводка: подпись слева, число справа, полоска снизу */
.metrics{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.metric{background:var(--surface);padding:10px 12px}
.metric .lb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3)}
.metric .vl{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink)}
.metric .vl small{font-size:11px;font-weight:400;color:var(--ink-3)}
.track{height:4px;border-radius:2px;background:var(--surface-3);margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.track i.over{background:var(--bad)}
.track i.info{background:var(--info)}

.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}

/* ============================================================
   6. ТРЕНИРОВКА
   ============================================================ */
.exl{display:flex;flex-direction:column;gap:6px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.open{border-color:var(--line-2)}
.ex.fin{opacity:.55}
.ex .eh{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px}
.ex .eh .ix{font-family:var(--f-num);font-size:11px;color:var(--ink-3);width:14px;flex:none}
.ex .eh .nm{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.3}
.ex .eh .nm em{display:block;font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:1px}
.ex .eh .st{font-family:var(--f-num);font-size:12px;color:var(--ink-3);flex:none}
.ex .eb{padding:0 12px 12px}
.ex .tip{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:var(--r-s);margin-bottom:10px}

.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:flex;gap:6px}
.setbtn{
  flex:1;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface-2);
  transition:background .1s,border-color .1s,transform .07s;
}
.setbtn .k{font-size:12px;color:var(--ink-3)}
.setbtn .v{margin-left:auto;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--ink-3)}
.setbtn[aria-pressed=true] .v{color:var(--accent-ink)}
.setbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setbtn[aria-pressed=true] .k{color:var(--accent-ink);opacity:.75}
.setbtn:active{transform:scale(.985)}
.setrow input{width:66px;flex:none;text-align:center;font-size:16px;font-weight:600;height:46px}

.rest{
  position:fixed;left:10px;right:10px;bottom:calc(var(--tabbar) + 10px + env(safe-area-inset-bottom));
  z-index:50;display:flex;align-items:center;gap:12px;padding:9px 12px 9px 9px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  box-shadow:0 6px 20px rgba(0,0,0,.16);max-width:420px;margin:0 auto;
}
.rest .ring{position:relative;width:52px;height:52px;flex:none}
.rest .ring svg{transform:rotate(-90deg)}
.rest .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.rest .tx{flex:1;min-width:0}
.rest .tx .t1{font-size:12px;color:var(--ink-3)}
.rest .tx .t2{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   7. ПИТАНИЕ, ТЕЛО, ПРОГРЕСС
   ============================================================ */
.rings{display:flex;gap:14px;align-items:center}
.rings .dial{position:relative;width:104px;height:104px;flex:none}
.rings .dial svg{width:100%;height:100%}
.rings .dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rings .dial .c b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600}
.rings .dial .c span{font-size:10px;color:var(--ink-3)}
.rings .lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rings .lg div{display:flex;align-items:center;gap:7px;font-size:12.5px}
.rings .lg i{width:8px;height:8px;border-radius:2px;flex:none}
.rings .lg b{margin-left:auto;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}

.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tm{font-family:var(--f-num);font-size:11px;color:var(--ink-3);width:38px;flex:none}
.row .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.row .tx em{display:block;font-style:normal;font-size:11px;color:var(--ink-3);font-family:var(--f-num)}
.row .vv{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.chip:hover{border-color:var(--ink-3)}
.chip b{font-family:var(--f-num);font-size:11px;color:var(--ink-3);font-weight:500}

.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots i{height:22px;border-radius:4px;background:var(--surface-3);display:block}
.dots i.on{background:var(--info)}

canvas{display:block;width:100%;height:auto}

.heat{display:flex;gap:3px}
.heat .w{display:flex;flex-direction:column;gap:3px}
.heat .d{width:13px;height:13px;border-radius:3px;background:var(--surface-3)}
.heat .d.l1{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.heat .d.l2{background:var(--accent);opacity:.45}
.heat .d.l3{background:var(--accent)}
.heat .d.l0{background:transparent;box-shadow:inset 0 0 0 1px var(--bad);opacity:.5}
.heat .d.now{box-shadow:0 0 0 2px var(--info)}
.heatwrap{display:flex;gap:5px;align-items:flex-start}
.heatwrap .dw{display:flex;flex-direction:column;gap:3px;font-family:var(--f-num);font-size:9px;color:var(--ink-3)}
.heatwrap .dw span{height:13px;line-height:13px}

.ladder{display:flex;flex-direction:column}
.ladder .s{position:relative;padding:5px 0 5px 20px;font-size:13px;color:var(--ink-3)}
.ladder .s::before{content:"";position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.ladder .s::after{content:"";position:absolute;left:6.5px;top:18px;bottom:-5px;width:1px;background:var(--line)}
.ladder .s:last-child::after{display:none}
.ladder .s.done{color:var(--ink-2)}
.ladder .s.done::before{background:var(--ink-3)}
.ladder .s.here{color:var(--ink);font-weight:600}
.ladder .s.here::before{background:var(--accent);width:10px;height:10px;left:2px;top:10px;box-shadow:0 0 0 3px var(--accent-soft)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:500;color:var(--ink-3);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
details.acc > summary{padding:12px 14px;cursor:pointer;font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
details.acc[open] > summary::after{transform:rotate(-135deg)}
details.acc .in{padding:0 14px 14px}

/* ============================================================
   8. МОДАЛКИ, ТОСТЫ
   ============================================================ */
.mback{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:460px;max-height:88vh;
  overflow:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin-bottom:10px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:16px}
.modal .acts .btn{flex:1}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom));
  z-index:120;display:flex;flex-direction:column;gap:6px;width:min(420px,calc(100vw - 24px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:var(--r-s);padding:10px 12px;font-size:13px;
  animation:tin .18s ease-out;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.good{background:var(--good);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================
   9. ДЕСКТОП
   ============================================================ */
@media (min-width:900px){
  body{font-size:14px}
  .wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding:0 20px}
  .rail{display:block;position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top));align-self:start;padding:16px 0;height:calc(100vh - var(--topbar))}
  .rail button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:var(--r-s);
    color:var(--ink-2);font-size:14px;font-weight:500;margin-bottom:2px}
  .rail button svg{width:18px;height:18px;flex:none}
  .rail button:hover{background:var(--surface-2)}
  .rail button[aria-current=true]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
  .tabbar{display:none}
  .screen{padding:20px 0 40px}
  .g2d{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  .g3d{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
  .metrics{grid-template-columns:repeat(4,1fr)}
  .figgrid{grid-template-columns:repeat(4,1fr)}
  .exguide .fig{width:150px}
  .mback{align-items:center;padding:20px}
  .modal{border-radius:14px}
  .rest{left:auto;right:20px;bottom:20px;width:360px;margin:0}
  .toasts{left:auto;right:20px;transform:none;bottom:20px}
  .hero .day{font-size:28px}
}

/* ============================================================
   10. ГИД: схемы упражнений, видео
   ============================================================ */
.fig{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:var(--r-s);color:var(--ink)}
.fig.big{max-width:280px;margin:0 auto}
.fig .b{stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .h{fill:currentColor;stroke:none}
.fig .eq{stroke:var(--line-2);stroke-width:4;stroke-linecap:round;fill:none}
.fig .gh{stroke:var(--ink-3);opacity:.32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .ghh{fill:var(--ink-3);opacity:.32}
.fig .ar{stroke:var(--accent-text);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

.figgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}
.figgrid .fig{height:104px}
.figcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px}
.figcard:hover{border-color:var(--ink-3)}
.figcard span{font-size:12.5px;font-weight:500;line-height:1.25}

.exguide{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.exguide .fig{width:104px;flex:none}
.exguide .gtx{flex:1;min-width:0}
.exguide .tip{margin-bottom:8px}

ul.cues{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
ul.cues li{margin-bottom:5px}
ul.cues.err li::marker{color:var(--bad)}

.lnk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lnk:last-child{border-bottom:0}
.lnk .pl{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
.lnk .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.lnk .tx em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lnk:hover .tx b{color:var(--accent-text)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* Экранирование текста, который попадает в innerHTML */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
const pad2 = n => (n < 10 ? "0" : "") + n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* Даты: везде работаем локальной строкой YYYY-MM-DD, без UTC-сюрпризов */
function isoDate(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseISO(s) { const p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function dowMon1(s) { const d = parseISO(s).getDay(); return d === 0 ? 7 : d; } // 1=пн … 7=вс
const DOW_SHORT = ["", "ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function humanDate(s) { const d = parseISO(s); return d.getDate() + " " + MONTHS_GEN[d.getMonth()]; }
function nowTime() { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function fmtDur(sec) { const m = Math.floor(sec / 60), s = Math.round(sec % 60); return m + ":" + pad2(s); }

/* --- Расчёт норм КБЖУ: Миффлин–Сан-Жеор × 1.35 − 400 ккал --- */
function computeTargets(st, weightKg) {
  const pr = st.profile;
  const bmr = Math.round(10 * weightKg + 6.25 * pr.heightCm - 5 * pr.age + (pr.sex === "m" ? 5 : -161));
  const tdee = Math.round(bmr * 1.35);
  const avg = tdee - 400;                       // умеренный дефицит: приоритет — сила
  const proteinG = Math.round(1.8 * weightKg / 5) * 5;
  const fatG = Math.round(0.82 * weightKg / 5) * 5;
  const kcalTraining = Math.round(avg * 1.0922 / 10) * 10;   // тренировочный день чуть выше среднего
  const kcalRest = Math.round(avg * 0.9223 / 10) * 10;       // нетренировочный — ниже
  const macroKcal = proteinG * 4 + fatG * 9;
  return {
    bmr, tdee, kcalAvg: avg, kcalTraining, kcalRest, proteinG, fatG,
    carbsTraining: Math.max(0, Math.floor((kcalTraining - macroKcal) / 4)),
    carbsRest: Math.max(0, Math.floor((kcalRest - macroKcal) / 4)),
    waterMl: 2500, caffeineMg: CAFFEINE_LIMIT,
    basedOnWeight: weightKg
  };
}

/* --- Загрузка / нормализация --- */
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return defaultState();
  try {
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch (e) {
    console.warn("Состояние повреждено, стартуем с дефолтного", e);
    return defaultState();
  }
}
/* Дополняем недостающие поля дефолтами — состояние старых версий не ломается */
function migrate(obj) {
  const d = defaultState();
  const st = Object.assign({}, d, obj);
  st.meta = Object.assign({}, d.meta, obj.meta);
  st.profile = Object.assign({}, d.profile, obj.profile);
  st.program = Object.assign({}, d.program, obj.program);
  st.program.ladders = Object.assign({}, d.program.ladders, (obj.program || {}).ladders);
  st.program.deferred = Object.assign({}, (obj.program || {}).deferred);
  st.settings = Object.assign({}, d.settings, obj.settings);
  st.settings.reminders = Object.assign({}, d.settings.reminders, (obj.settings || {}).reminders);
  st.ui = Object.assign({ dismissed: {} }, obj.ui);
  ["sessions", "walks", "meals", "water", "caffeine", "body", "tests", "customFoods"].forEach(k => {
    if (!Array.isArray(st[k])) st[k] = d[k];
  });
  if (!st.targets || !st.targets.kcalTraining) st.targets = computeTargets(st, latestWeight(st));
  return st;
}

let state = loadState();

/* --- Единственная точка записи, с дебаунсом --- */
let saveTimer = null;
function saveState(immediate) {
  state.meta.updatedAt = new Date().toISOString();
  const write = () => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast("Не удалось сохранить: хранилище браузера переполнено или закрыто", "bad"); }
  };
  clearTimeout(saveTimer);
  if (immediate) write(); else saveTimer = setTimeout(write, 350);
}

/* =====================================================================

   ===================================================================== */
function latestWeight(st) {
  st = st || state;
  const b = st.body.filter(x => typeof x.weightKg === "number");
  return b.length ? b[b.length - 1].weightKg : st.profile.startWeightKg;
}
function weightOn(dateStr) {
  const b = state.body.filter(x => typeof x.weightKg === "number" && x.date <= dateStr);
  return b.length ? b[b.length - 1].weightKg : state.profile.startWeightKg;
}
/* Номер недели плана по календарю (1…36+) */
function weekNumber(dateStr) {
  const start = state.program.startedAt;
  const startMonday = addDays(start, -(dowMon1(start) - 1));
  return Math.max(1, Math.floor(daysBetween(startMonday, dateStr || isoDate()) / 7) + 1);
}
function phaseOfWeek(w) {
  for (const p of PHASES) if (w >= p.from && w <= p.to) return p;
  return PHASES[PHASES.length - 1];
}
const isDeloadWeek = w => w % 7 === 0;   // каждая 7-я неделя — разгрузочная

/* Какой сегодня день программы: A / B / walk / rest.
   Схема: нечётная неделя A-B-A, чётная B-A-B (зеркальная). */
function dayPlanFor(dateStr) {
  const dow = dowMon1(dateStr);
  const w = weekNumber(dateStr);
  const td = state.profile.trainingDays;
  const idx = td.indexOf(dow);
  if (idx >= 0) {
    const mirrored = w % 2 === 0;
    const seq = mirrored ? ["B", "A", "B"] : ["A", "B", "A"];
    return { kind: "train", day: seq[idx % seq.length], week: w, phase: phaseOfWeek(w), deload: isDeloadWeek(w) };
  }
  if (dow === 2 || dow === 4) return { kind: "walk", week: w, phase: phaseOfWeek(w), deload: isDeloadWeek(w) };
  return { kind: "rest", week: w, phase: phaseOfWeek(w), deload: isDeloadWeek(w) };
}

/* Норма ккал на дату: тренировочный день или нет */
function targetsForDate(dateStr) {
  const t = state.targets;
  const plan = dayPlanFor(dateStr);
  const train = plan.kind === "train";
  return {
    kcal: train ? t.kcalTraining : t.kcalRest,
    p: t.proteinG, f: t.fatG,
    c: train ? t.carbsTraining : t.carbsRest,
    training: train
  };
}

/* Пересчёт норм при падении веса на каждые 5 кг */
function maybeRecalcTargets() {
  const w = latestWeight();
  const base = state.targets.basedOnWeight || state.profile.startWeightKg;
  if (base - w >= 5) {
    const stepped = base - Math.floor((base - w) / 5) * 5;
    state.targets = computeTargets(state, stepped);
    toast("Вес " + stepped + " кг — норма пересчитана: " + state.targets.kcalTraining + "/" + state.targets.kcalRest + " ккал", "good", 7000);
    return true;
  }
  return false;
}

/* --- Список упражнений на день с учётом режима и разгрузки --- */
function exercisesFor(plan) {
  if (plan.kind !== "train") return [];
  const home = state.profile.mode === "home";
  let list = plan.phase.days[plan.day].map(e => {
    const o = Object.assign({}, e);
    if (home && e.home) { o.name = e.home; o.substituted = true; }
    if (plan.deload) o.sets = Math.max(1, Math.round(e.sets * 0.6)); // объём −40%
    /* Домашний режим: тяга ограничена, поэтому +2 подхода жиму и корпусу */
    if (home && (e.chain === "push" || e.chain === "core") && e.unit !== "min") o.sets = o.sets + 2;
    return o;
  });
  return list;
}

/* --- Прогресс по лестницам --- */
function ladderIndex(chain) {
  const l = LADDERS[chain]; if (!l) return -1;
  return Math.max(0, l.steps.findIndex(s => s.id === state.program.ladders[chain]));
}
function ladderStepName(chain) {
  const l = LADDERS[chain]; if (!l) return "";
  const i = ladderIndex(chain);
  return l.steps[i] ? l.steps[i].name : "";
}
function ladderMove(chain, delta) {
  const l = LADDERS[chain]; if (!l) return;
  const i = clamp(ladderIndex(chain) + delta, 0, l.steps.length - 1);
  state.program.ladders[chain] = l.steps[i].id;
  saveState();
}

/* --- Предыдущий результат по упражнению --- */
function lastResultFor(key, beforeId) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    if (beforeId && s.id === beforeId) continue;
    const e = s.exercises.find(x => x.key === key && !x.skipped);
    if (e && e.sets.some(x => x.done)) return { session: s, ex: e };
  }
  return null;
}
function exVolume(e) {
  return e.sets.reduce((a, s) => a + (s.done ? (Number(s.reps) || Number(s.seconds) || 0) : 0), 0);
}

/* --- Двойная прогрессия: все рабочие подходы взяли верхнюю границу --- */
function hitsTopOfRange(e) {
  const done = e.sets.filter(s => s.done);
  if (!done.length || done.length < (e.targetSets || done.length)) return false;
  if (e.max >= 900) return false;                       // «максимум» не считаем
  return done.every(s => (Number(s.reps) || Number(s.seconds) || 0) >= e.max);
}
/* Предложения усложнить: по цепочкам из последней тренировки */
function promotionSuggestions(session) {
  const out = [];
  const seen = {};
  (session.exercises || []).forEach(e => {
    if (!e.chain || !LADDERS[e.chain] || seen[e.chain]) return;
    if (!hitsTopOfRange(e)) return;
    const def = state.program.deferred[e.chain];
    if (def && def > isoDate()) return;                 // отложено «ещё на неделю»
    const l = LADDERS[e.chain], i = ladderIndex(e.chain);
    if (i >= l.steps.length - 1) return;
    seen[e.chain] = true;
    out.push({ chain: e.chain, from: l.steps[i].name, to: l.steps[i + 1].name, via: e.name });
  });
  return out;
}
/* Застой: 3 тренировки подряд без роста объёма по упражнению */
function stagnantExercises() {
  const byKey = {};
  state.sessions.slice(-12).forEach(s => {
    (s.exercises || []).forEach(e => {
      if (e.skipped) return;
      (byKey[e.key] = byKey[e.key] || []).push({ name: e.name, v: exVolume(e) });
    });
  });
  const res = [];
  Object.keys(byKey).forEach(k => {
    const arr = byKey[k];
    if (arr.length < 3) return;
    const t = arr.slice(-3);
    if (t[1].v <= t[0].v && t[2].v <= t[1].v) res.push(t[2].name);
  });
  return res;
}
/* Пропуск 7+ дней */
function longGapDays() {
  if (!state.sessions.length) return 0;
  const last = state.sessions[state.sessions.length - 1].date;
  return daysBetween(last, isoDate());
}

/* --- Стрик: подряд идущие дни, где план выполнен (тренировка / ходьба / отдых) --- */
function computeStreak() {
  let n = 0;
  let d = isoDate();
  for (let i = 0; i < 400; i++) {
    const plan = dayPlanFor(d);
    let ok;
    if (plan.kind === "train") ok = state.sessions.some(s => s.date === d);
    else if (plan.kind === "walk") ok = state.walks.some(w => w.date === d && w.done);
    else ok = true;
    /* сегодняшний невыполненный день стрик не рвёт — он ещё впереди */
    if (!ok) { if (i === 0) { d = addDays(d, -1); continue; } break; }
    if (plan.kind !== "rest") n++;
    d = addDays(d, -1);
  }
  return n;
}

/* --- Суммы по дню для питания / воды / кофеина --- */
function mealsOn(dateStr) { return state.meals.filter(m => m.date === dateStr); }
function dayTotals(dateStr) {
  return mealsOn(dateStr).reduce((a, m) => {
    a.kcal += m.kcal; a.p += m.p; a.f += m.f; a.c += m.c; return a;
  }, { kcal: 0, p: 0, f: 0, c: 0 });
}
function waterOn(dateStr) { const r = state.water.find(w => w.date === dateStr); return r ? r.ml : 0; }
function caffeineOn(dateStr) { const r = state.caffeine.find(w => w.date === dateStr); return r || { date: dateStr, mg: 0, lastAt: null }; }
function foodByKey(k) { return FOODS.find(f => f.key === k) || state.customFoods.find(f => f.key === k) || null; }

function ic(id, size, w) {

    '" fill="none" stroke="currentColor" stroke-width="' + (w || 1.6) +

function toast(text, kind, ms) {
  const el = document.createElement("div");

  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), ms || 3200);
}

/* Модалка вместо confirm(): возвращает Promise */
function modal(o) {
  return new Promise(resolve => {
    const back = document.createElement("div");
    back.className = "mback";
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(o.title || "Диалог") + '">' +
      '<h3>' + esc(o.title || "") + '</h3>' +
      (o.html || ("<p class=\"mid\">" + esc(o.text || "") + "</p>")) +
      '<div class="acts">' +
        (o.cancel === false ? "" : '<button type="button" class="btn ghost" data-a="no">' + esc(o.cancelText || "Отмена") + '</button>') +
        '<button type="button" class="btn ' + (o.danger ? "danger" : "pri") + '" data-a="yes">' + esc(o.okText || "Да") + '</button>' +
      '</div></div>';
    $("#modal-root").appendChild(back);
    const box = $(".modal", back);
    const done = v => { back.remove(); document.removeEventListener("keydown", key); resolve(v); };
    function key(e) {
      if (e.key === "Escape") return done(false);
      if (e.key !== "Tab") return;
      const f = $$('button,input,select,textarea', box);
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
    back.addEventListener("click", e => {
      const b = e.target.closest("[data-a]");
      if (b) return done(b.dataset.a === "yes" ? (o.collect ? o.collect(box) : true) : false);
      if (e.target === back) done(false);
    });
    document.addEventListener("keydown", key);
    const first = $("input,select,textarea", box) || $("[data-a=yes]", box);
    if (first) first.focus();
  });
}

/* Тема: три состояния, системная разрешается в JS */
const mqDark = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const pref = state.settings.theme;
  const real = pref === "system" ? (mqDark.matches ? "dark" : "light") : pref;
  document.documentElement.setAttribute("data-theme", real);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", real === "dark" ? "#0B0C0E" : "#F4F5F7");
  const btn = $("#theme-btn");
  if (btn) {
    btn.innerHTML = ic(pref === "system" ? "ic-auto" : pref === "dark" ? "ic-moon" : "ic-sun", 19);
    btn.title = pref === "system" ? "Тема: как в системе" : pref === "dark" ? "Тема: тёмная" : "Тема: светлая";
  }
  redrawCharts();
}
mqDark.addEventListener("change", () => { if (state.settings.theme === "system") applyTheme(); });

/* Звук и вибро */
let actx = null;
function beep() {
  if (!state.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = 920;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.26);
  } catch (e) {}
}
function buzz(ms) {
  if (!state.settings.vibrate || !navigator.vibrate) return;
  try { navigator.vibrate(ms || 15); } catch (e) {}
}

function showTab(id, keepScroll) {

}

/* --- Таймер отдыха --- */
const rest = { total: 0, left: 0, tick: null };
function startRest(sec, label) {
  if (!sec) return;
  stopRest();
  rest.total = sec; rest.left = sec;
  $("#rest-root").innerHTML =
    '<div class="rest" role="status">' +
      '<div class="ring"><svg viewBox="0 0 52 52" width="52" height="52">' +
        '<circle cx="26" cy="26" r="22" fill="none" stroke="var(--surface-3)" stroke-width="5"/>' +
        '<circle id="r-arc" cx="26" cy="26" r="22" fill="none" stroke="var(--accent)" stroke-width="5" ' +
        'stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/>' +
      '</svg><b id="r-sec">' + sec + '</b></div>' +
      '<div class="tx"><div class="t1">Отдых</div><div class="t2">' + esc(label || "") + '</div></div>' +
      '<button type="button" class="btn sm ghost" id="r-skip">Дальше</button>' +
    '</div>';
  $("#r-skip").addEventListener("click", stopRest);
  paintRest();
  rest.tick = setInterval(() => {
    rest.left--;
    if (rest.left <= 0) { beep(); buzz(35); stopRest(); toast("Отдых окончен"); return; }
    paintRest();
  }, 1000);
}
function paintRest() {
  const s = $("#r-sec"), a = $("#r-arc");
  if (!s || !a) return;
  s.textContent = rest.left;
  a.setAttribute("stroke-dashoffset", String(2 * Math.PI * 22 * (1 - rest.left / rest.total)));
}
function stopRest() { clearInterval(rest.tick); rest.tick = null; $("#rest-root").innerHTML = ""; }

let charts = [];
function redrawCharts() { charts = charts.filter(f => f()); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* Компактные кольца КБЖУ */
function ringsHTML(tot, tgt) {
  const R = [46, 36, 26, 16];
  const D = [
    { l: "Ккал", v: tot.kcal, t: tgt.kcal, c: "var(--accent)", u: "" },
    { l: "Белок", v: tot.p, t: tgt.p, c: "var(--info)", u: " г" },
    { l: "Жиры", v: tot.f, t: tgt.f, c: "var(--warn)", u: " г" },
    { l: "Углеводы", v: tot.c, t: tgt.c, c: "var(--good)", u: " г" }
  ];
  let arcs = "", lg = "";
  D.forEach((d, i) => {
    const C = 2 * Math.PI * R[i], fr = clamp(d.t ? d.v / d.t : 0, 0, 1);
    arcs += '<circle cx="52" cy="52" r="' + R[i] + '" fill="none" stroke="var(--surface-3)" stroke-width="6"/>' +
      '<circle cx="52" cy="52" r="' + R[i] + '" fill="none" stroke="' + d.c + '" stroke-width="6" stroke-linecap="round" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - fr)).toFixed(1) + '" ' +
      'transform="rotate(-90 52 52)" style="transition:stroke-dashoffset .45s ease"/>';
    const over = d.v > d.t * 1.02;
    lg += '<div><i style="background:' + d.c + '"></i><span>' + d.l + '</span>' +
      '<b style="color:' + (over ? "var(--bad)" : "var(--ink)") + '">' + Math.round(d.v) + " / " + Math.round(d.t) + d.u + '</b></div>';
  });
  const left = Math.round(tgt.kcal - tot.kcal);
  return '<div class="rings"><div class="dial"><svg viewBox="0 0 104 104">' + arcs + '</svg>' +
    '<div class="c"><b style="color:' + (left < 0 ? "var(--bad)" : "var(--ink)") + '">' + left + '</b><span>осталось</span></div></div>' +
    '<div class="lg">' + lg + '</div></div>';
}

/* Теплокарта: столбец = неделя, ячейка = день */
function heatHTML(weeks) {
  weeks = weeks || 12;
  const today = isoDate();
  const start = addDays(today, -(dowMon1(today) - 1) - (weeks - 1) * 7);
  let cols = "";
  for (let w = 0; w < weeks; w++) {
    let cells = "";
    for (let d = 0; d < 7; d++) {
      const date = addDays(start, w * 7 + d);
      let cls = "d", ttl = humanDate(date);
      if (date <= today) {
        const p = dayPlanFor(date);
        if (state.sessions.some(s => s.date === date)) { cls += " l3"; ttl += " · тренировка"; }
        else if (state.walks.some(x => x.date === date && x.done)) { cls += " l2"; ttl += " · ходьба"; }
        else if (p.kind === "rest") { cls += " l1"; ttl += " · отдых"; }
        else { cls += " l0"; ttl += " · пропуск"; }
      } else ttl += " · впереди";
      if (date === today) cls += " now";
      cells += '<div class="' + cls + '" title="' + esc(ttl) + '"></div>';
    }
    cols += '<div class="w">' + cells + '</div>';
  }
  return '<div class="heatwrap"><div class="dw">' + ["ПН", "", "СР", "", "ПТ", "", "ВС"].map(x => "<span>" + x + "</span>").join("") +
    '</div><div class="scrollx"><div class="heat">' + cols + '</div></div></div>';
}

function canvasCtx(cv, h) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 320;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return { c, w, h };
}

/* График веса: точки — факт, линия — среднее за 7 дней, пунктир — прогноз */
function weightChart(cv) {
  const draw = () => {
    if (!cv.isConnected) return false;
    const { c, w, h } = canvasCtx(cv, 190);
    const pad = { l: 32, r: 8, t: 10, b: 18 };
    const start = state.program.startedAt;
    const pts = state.body.filter(b => typeof b.weightKg === "number")
      .map(b => ({ x: daysBetween(start, b.date), y: b.weightKg }));
    const w0 = pts.length ? pts[0].y : state.profile.startWeightKg;
    const fc = [];
    for (let k = 0; k <= 36; k++) fc.push({ x: k * 7, y: Math.max(75, w0 - 0.4 * k) });
    const maxX = 252;
    const ys = pts.map(p => p.y).concat(fc.map(p => p.y));
    let lo = Math.min.apply(null, ys) - 1, hi = Math.max.apply(null, ys) + 1;
    if (!isFinite(lo)) { lo = 70; hi = 90; }
    const X = v => pad.l + (v / maxX) * (w - pad.l - pad.r);
    const Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
    const line = cssVar("--line"), dim = cssVar("--ink-3"), acc = cssVar("--accent");
    c.font = '10px ' + cssVar("--f-num");
    c.strokeStyle = line; c.fillStyle = dim; c.lineWidth = 1;
    const step = Math.max(1, Math.round((hi - lo) / 4));
    for (let v = Math.ceil(lo); v <= hi; v += step) {
      const y = Math.round(Y(v)) + .5;
      c.beginPath(); c.moveTo(pad.l, y); c.lineTo(w - pad.r, y); c.stroke();
      c.fillText(String(v), 2, y + 3.5);
    }
    for (let k = 0; k <= 36; k += 6) c.fillText("н" + k, X(k * 7) - 6, h - 4);
    c.setLineDash([3, 4]); c.strokeStyle = dim; c.lineWidth = 1.5;
    c.beginPath(); fc.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke();
    c.setLineDash([]);
    c.fillStyle = dim;
    pts.forEach(p => c.fillRect(X(p.x) - 1.5, Y(p.y) - 1.5, 3, 3));
    if (pts.length) {
      const ma = pts.map(p => {
        const win = pts.filter(q => q.x <= p.x && q.x > p.x - 7);
        return { x: p.x, y: win.reduce((a, q) => a + q.y, 0) / win.length };
      });
      c.strokeStyle = acc; c.lineWidth = 2.5; c.lineJoin = "round"; c.lineCap = "round";
      c.beginPath(); ma.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke();
      if (ma.length === 1) { c.fillStyle = acc; c.beginPath(); c.arc(X(ma[0].x), Y(ma[0].y), 3, 0, 7); c.fill(); }
    }
    return true;
  };
  draw(); charts.push(draw);
}

/* Мини-график норматива */
function miniChart(cv, series) {
  const draw = () => {
    if (!cv.isConnected) return false;
    const { c, w, h } = canvasCtx(cv, 54);
    if (!series.length) return true;
    const hi = Math.max.apply(null, series.map(p => p.v)) * 1.2 + 1;
    const X = i => 2 + (series.length < 2 ? 0 : i / (series.length - 1)) * (w - 4);
    const Y = v => h - 6 - (v / hi) * (h - 12);
    c.strokeStyle = cssVar("--accent"); c.lineWidth = 2; c.lineJoin = "round"; c.lineCap = "round";
    c.beginPath(); series.forEach((p, i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v))); c.stroke();
    c.fillStyle = cssVar("--accent");
    series.forEach((p, i) => { c.beginPath(); c.arc(X(i), Y(p.v), 2.2, 0, 7); c.fill(); });
    return true;
  };
  draw(); charts.push(draw);
}

const UNIT = { reps: "повт", sec: "сек", legreps: "повт/ногу", min: "мин" };
function rangeText(e) {
  const r = e.min === e.max ? String(e.min) : (e.max >= 900 ? e.min + "+" : e.min + "–" + e.max);
  return e.sets + "×" + r + " " + (UNIT[e.unit] || "");
}
function buildSession(date) {
  const plan = dayPlanFor(date);
  if (plan.kind !== "train") return null;
  return {
    id: uid(), date, day: plan.day, week: plan.week, phase: plan.phase.n,
    mode: state.profile.mode, deload: plan.deload, startedAtMs: Date.now(),
    durationSec: 0, note: "",
    exercises: exercisesFor(plan).map(e => {
      const prev = lastResultFor(e.key);
      let pre = e.min;
      if (prev) {
        const last = prev.ex.sets.filter(s => s.done).slice(-1)[0];
        if (last) pre = last.reps != null ? last.reps : last.seconds;
      }
      const sets = [];
      for (let i = 0; i < e.sets; i++) sets.push({ reps: null, seconds: null, done: false, value: pre });
      return {
        key: e.key, name: e.name, chain: e.chain, unit: e.unit, rest: e.rest, tip: e.tip,
        substituted: !!e.substituted, ladderStep: LADDERS[e.chain] ? ladderStepName(e.chain) : "",
        targetSets: e.sets, min: e.min, max: e.max, sets, note: "", skipped: false, skipReason: null

}

      '<button type="button" class="btn sm ghost" id="t-all">Весь план</button></div>' +
      list.map((e, i) => '<div class="row"><span class="tm">' + (i + 1) + '</span><span class="tx">' + esc(e.name) +
        '</span><span class="vv dim">' + esc(rangeText(e)) + '</span>' +
        (EX_GUIDE[e.key] ? '<button type="button" class="iconbtn sm" data-guide="' + esc(EX_GUIDE[e.key]) +
          '" aria-label="Как делать: ' + esc(e.name) + '">' + ic("ic-info", 15) + '</button>' : "") + '</div>').join("") + '</div>';
  }

  /* где мы в 36-недельном плане */
  if (plan.kind !== "rest") {
    h += '<div class="card tight"><div class="between" style="font-size:12px">' +
      '<span class="dim">Фаза ' + plan.phase.n + ' · ' + esc(plan.phase.name) + '</span>' +
      '<span class="n dim">неделя ' + plan.week + ' / 36</span></div>' +
      '<div class="track" style="margin-top:7px"><i style="width:' + (plan.week / 36 * 100).toFixed(1) + '%"></i></div></div>';
  }

  el.innerHTML = h;
  const go = $("#t-go");
  if (go) go.addEventListener("click", () => { if (state.active) showTab("workout"); else startWorkout(); });
  const wk = $("#t-walk"); if (wk) wk.addEventListener("click", toggleWalk);
  const all = $("#t-all"); if (all) all.addEventListener("click", () => showTab("workout"));
  const roll = $("#t-roll");
  if (roll) roll.addEventListener("click", () => {
    Object.keys(LADDERS).forEach(c => ladderMove(c, -1));
    state.ui.dismissed["g" + gap] = true; saveState(); renderToday();
    toast("Ступени откачены на одну", "good");
  });
  const gx = $("#t-gx");
  if (gx) gx.addEventListener("click", () => { state.ui.dismissed["g" + gap] = true; saveState(); renderToday(); });
  bindGuides(el);
}

/* =====================================================================
   БЛОК 8. ПИТАНИЕ
   ===================================================================== */
function addMeal(items, time) {
  const s = items.reduce((a, i) => { a.k += i.kcal; a.p += i.p; a.f += i.f; a.c += i.c; return a; }, { k: 0, p: 0, f: 0, c: 0 });
  state.meals.push({
    id: uid(), date: isoDate(), time: time || nowTime(), items,
    kcal: Math.round(s.k), p: round1(s.p), f: round1(s.f), c: round1(s.c)
  });
  saveState();
}
function itemFood(f, g) {
  const k = g / 100;
  return { foodKey: f.key, name: f.name, grams: g, kcal: Math.round(f.kcal * k), p: round1(f.p * k), f: round1(f.f * k), c: round1(f.c * k) };
}
function itemDish(d) { return { foodKey: d.key, name: d.name, grams: null, kcal: d.kcal, p: d.p, f: d.f, c: d.c }; }

function renderFood() {
  const el = $("#s-food"), today = isoDate();
  const tg = targetsForDate(today), tot = dayTotals(today);
  const list = mealsOn(today).slice().sort((a, b) => a.time < b.time ? -1 : 1);
  const ml = waterOn(today), caf = caffeineOn(today), late = new Date().getHours() >= 16;

  let h = '<div class="card">' + ringsHTML(tot, tg) +
    '<div class="dim" style="font-size:11px;margin-top:10px">' + (tg.training ? "Тренировочный день" : "Нетренировочный день") +
    ' · норма от веса ' + (state.targets.basedOnWeight || state.profile.startWeightKg) + ' кг</div></div>';

  h += '<div class="card"><div class="flex" style="margin-bottom:10px">' +
    '<button type="button" class="btn pri sm" id="f-tpl">Шаблон дня</button>' +
    '<button type="button" class="btn sm" id="f-yday">Повторить вчера</button>' +
    '<button type="button" class="btn sm ghost" id="f-own">Мой продукт</button></div>' +
    '<div class="chips">' + DISHES.map(d => '<button type="button" class="chip" data-dish="' + d.key + '" title="' + esc(d.made) + '">' +
      esc(d.name) + '<b>' + d.kcal + '</b></button>').join("") + '</div>' +
    '<input type="search" id="f-q" placeholder="Продукт по граммам: курица, творог, рис…" style="margin-top:10px">' +
    '<div class="chips" id="f-res" style="margin-top:8px"></div></div>';

  h += '<div class="card"><div class="between" style="margin-bottom:4px"><h3>Съедено сегодня</h3>' +
    '<span class="pill">' + Math.round(tot.kcal) + ' ккал</span></div>' +
    (list.length ? list.map(m => '<div class="row"><span class="tm">' + esc(m.time) + '</span>' +
      '<span class="tx">' + esc(m.items.map(i => i.name + (i.grams ? " " + i.grams + " г" : "")).join(", ")) +
      '<em>Б ' + m.p + " · Ж " + m.f + " · У " + m.c + '</em></span><span class="vv">' + m.kcal + '</span>' +
      '<button type="button" class="iconbtn sm danger" data-del="' + m.id + '" aria-label="Удалить">' + ic("ic-trash", 15) + '</button></div>').join("")
      : '<p class="dim" style="font-size:13px;margin:6px 0 0">Пусто. Прими шаблон дня одной кнопкой.</p>') + '</div>';

  const cells = [];
  for (let i = 0; i < 10; i++) cells.push('<i class="' + (i < Math.round(ml / 250) ? "on" : "") + '"></i>');
  h += '<div class="g2d"><div class="card"><div class="between" style="margin-bottom:8px"><h3>Вода</h3>' +
    '<span class="n" style="font-size:15px;font-weight:600">' + (ml / 1000).toFixed(2) + ' <span class="dim" style="font-size:11px">/ 2.5 л</span></span></div>' +
    '<div class="dots">' + cells.join("") + '</div>' +
    '<div class="flex" style="margin-top:10px"><button type="button" class="btn sm pri" id="w-add">' + ic("ic-plus", 14) + ' 250 мл</button>' +
    '<button type="button" class="btn sm ghost" id="w-sub">' + ic("ic-minus", 14) + '</button></div></div>';

  h += '<div class="card"><div class="between" style="margin-bottom:8px"><h3>Кофеин</h3>' +
    '<span class="n" style="font-size:15px;font-weight:600;color:' + (caf.mg > CAFFEINE_LIMIT ? "var(--bad)" : caf.mg >= 240 ? "var(--warn)" : "var(--ink)") + '">' +
    caf.mg + ' <span class="dim" style="font-size:11px">/ ' + CAFFEINE_LIMIT + ' мг</span></span></div>' +
    '<div class="track"><i class="' + (caf.mg > CAFFEINE_LIMIT ? "over" : "") + '" style="width:' + Math.min(100, caf.mg / CAFFEINE_LIMIT * 100) + '%"></i></div>' +
    '<div class="flex" style="margin-top:10px"><button type="button" class="btn sm" id="c-n">Банка 0.5</button>' +
    '<button type="button" class="btn sm" id="c-z">Zero</button>' +
    '<button type="button" class="btn sm ghost" id="c-r">Сброс</button></div>' +
    '<p class="' + (late ? "" : "dim") + '" style="font-size:12px;margin:10px 0 0' + (late ? ";color:var(--warn)" : "") + '">' +
    (late ? "После 16:00. Кофеин живёт 5–6 часов, отбой в 23:00 — сон и есть рост силы."
          : "Обычная банка ≈ 220 ккал и 52 г сахара. Шаг первый — zero, шаг второй — не позже 16:00.") + '</p></div></div>';

  h += '<details class="acc"><summary>' + ic("ic-info", 16) + 'Правила доставки</summary><div class="in">' +
    '<p class="mid" style="font-size:13px"><b>Правило одного заказа:</b> доставка занимает один приём пищи, остальные три собираются дома.</p>' +
    '<table><tbody>' + DELIVERY_RULES.map(r => '<tr><td style="white-space:nowrap"><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td></tr>').join("") + '</tbody></table>' +
    '<div class="flex" style="margin-top:10px">' + DELIVERY_STOP.map(s => '<span class="pill bad">' + esc(s) + '</span>').join("") + '</div></div></details>';

  el.innerHTML = h;

  $("#f-tpl").addEventListener("click", () => modal({
    title: "Шаблон дня", text: "Добавить четыре приёма: 11:00, 15:00, 18:00, 21:00?", okText: "Добавить"
  }).then(ok => {
    if (!ok) return;
    DAY_TEMPLATE.forEach(r => addMeal([itemDish(DISHES.find(d => d.key === r.dish))], r.time));
    saveState(true); renderFood(); toast("Шаблон добавлен", "good");
  }));
  $("#f-yday").addEventListener("click", () => {
    const y = mealsOn(addDays(today, -1));
    if (!y.length) return toast("Вчера ничего не записано", "bad");
    y.forEach(m => addMeal(m.items.map(i => Object.assign({}, i)), m.time));
    saveState(true); renderFood(); toast("Вчерашний день скопирован", "good");
  });
  $("#f-own").addEventListener("click", customFood);
  $$("[data-dish]", el).forEach(b => b.addEventListener("click", () => {
    const d = DISHES.find(x => x.key === b.dataset.dish);
    addMeal([itemDish(d)]); buzz(15); renderFood(); toast(d.name + " добавлено", "good");
  }));
  $$("[data-del]", el).forEach(b => b.addEventListener("click", () => {
    state.meals = state.meals.filter(m => m.id !== b.dataset.del);
    saveState(); renderFood(); toast("Удалено");
  }));
  $("#w-add").addEventListener("click", () => water(250));
  $("#w-sub").addEventListener("click", () => water(-250));
  $("#c-n").addEventListener("click", () => caffeine(true));
  $("#c-z").addEventListener("click", () => caffeine(false));
  $("#c-r").addEventListener("click", () => { state.caffeine = state.caffeine.filter(c => c.date !== today); saveState(); renderFood(); });

  const q = $("#f-q"), res = $("#f-res");
  const all = () => FOODS.concat(state.customFoods);
  const paint = () => {
    const s = q.value.trim().toLowerCase();
    const f = all().filter(x => !s || x.name.toLowerCase().indexOf(s) >= 0).slice(0, s ? 18 : 8);
    res.innerHTML = f.length ? f.map(x => '<button type="button" class="chip" data-food="' + esc(x.key) + '">' +
      esc(x.name) + '<b>' + x.kcal + '</b></button>').join("") : '<span class="dim" style="font-size:13px">Не найдено</span>';
    $$("[data-food]", res).forEach(b => b.addEventListener("click", () => askGrams(b.dataset.food)));
  };
  q.addEventListener("input", paint); paint();
}
function askGrams(key) {
  const f = foodByKey(key); if (!f) return;
  modal({
    title: f.name,
    html: '<p class="mid" style="font-size:13px">На 100 г: ' + f.kcal + ' ккал · Б ' + f.p + ' · Ж ' + f.f + ' · У ' + f.c + '</p>' +
      '<div class="field"><span>Граммы</span><input type="number" inputmode="numeric" id="g" value="100" min="1" max="3000"></div>',
    okText: "Добавить", collect: b => Number($("#g", b).value)
  }).then(g => {
    if (!g || g <= 0) return;
    addMeal([itemFood(f, g)]); buzz(15); renderFood(); toast(f.name + " " + g + " г", "good");
  });
}
function customFood() {
  modal({
    title: "Мой продукт",
    html: '<p class="mid" style="font-size:13px">КБЖУ на 100 г, как на упаковке.</p>' +
      '<div class="field" style="margin-bottom:8px"><span>Название</span><input type="text" id="cn"></div>' +
      '<div class="flex" style="flex-wrap:nowrap">' +
      ['ck:Ккал', 'cp:Белок', 'cf:Жиры', 'cc:Углев.'].map(x => {
        const p = x.split(":");
        return '<div class="field" style="flex:1"><span>' + p[1] + '</span><input type="number" id="' + p[0] + '" value="0"></div>';
      }).join("") + '</div>',
    okText: "Сохранить",
    collect: b => ({
      name: $("#cn", b).value.trim(), kcal: +$("#ck", b).value || 0,
      p: +$("#cp", b).value || 0, f: +$("#cf", b).value || 0, c: +$("#cc", b).value || 0
    })
  }).then(v => {
    if (!v || !v.name) return;
    state.customFoods.push({ key: "cf_" + uid(), name: v.name, kcal: v.kcal, p: v.p, f: v.f, c: v.c });
    saveState(); renderFood(); toast("Сохранено — теперь в поиске", "good");
  });
}
function water(d) {
  const t = isoDate();
  let r = state.water.find(w => w.date === t);
  if (!r) { r = { date: t, ml: 0 }; state.water.push(r); }
  r.ml = clamp(r.ml + d, 0, 6000);
  buzz(10); saveState(); renderFood();
}
function caffeine(sugar) {
  const t = isoDate();
  let r = state.caffeine.find(c => c.date === t);
  if (!r) { r = { date: t, mg: 0, lastAt: null }; state.caffeine.push(r); }
  r.mg += CAFFEINE_PER_CAN; r.lastAt = nowTime();
  addMeal([itemFood(FOODS.find(f => f.key === (sugar ? "energy" : "energy_zero")), 500)]);
  saveState(); renderFood();
  if (r.mg > CAFFEINE_LIMIT) toast("Потолок кофеина превышен: " + r.mg + " мг", "bad");
  else if (new Date().getHours() >= 16) toast("После 16:00 — это заберёт сон", "bad");
}

/* =====================================================================
   БЛОК 9. ТЕЛО И ПРОГРЕСС (объединены)
   ===================================================================== */
const TESTS = [
  { k: "pullups", n: "Подтягивания", u: "повт" },
  { k: "pushups", n: "Отжимания", u: "повт" },
  { k: "plankSec", n: "Планка", u: "сек" },
  { k: "hollowSec", n: "Hollow hold", u: "сек" },
  { k: "frontLeverSec", n: "Front lever", u: "сек" }
];
function renderBody() {
  const el = $("#s-body");
  const b = state.body.slice().sort((x, y) => x.date < y.date ? -1 : 1);
  const last = b.filter(x => typeof x.weightKg === "number").slice(-1)[0];
  const waist = b.filter(x => typeof x.waistCm === "number").slice(-1)[0];
  const d7 = weightDelta7();
  const tests = state.tests.slice().sort((x, y) => x.date < y.date ? -1 : 1);
  const ses = state.sessions;
  const sets = ses.reduce((n, s) => n + s.exercises.reduce((m, e) => m + e.sets.filter(x => x.done).length, 0), 0);
  const reps = ses.reduce((n, s) => n + s.exercises.reduce((m, e) => m + exVolume(e), 0), 0);

  let h = '<div class="card"><div class="between" style="margin-bottom:10px"><h3>Вес</h3>' +
    '<span class="n" style="font-size:19px;font-weight:600">' + (last ? last.weightKg.toFixed(1) : "—") +
    ' <span class="dim" style="font-size:11px">кг</span>' +
    (d7 == null ? "" : ' <span class="pill ' + (d7 <= 0 ? "good" : "warn") + '">' + (d7 > 0 ? "+" : "") + d7.toFixed(1) + '</span>') + '</span></div>' +
    '<canvas id="wc" role="img" aria-label="График веса"></canvas>' +
    '<div class="flex" style="margin-top:8px;font-size:11px">' +
    '<span class="pill acc">среднее за 7 дней</span><span class="pill">точки — факт</span><span class="pill">пунктир — прогноз</span></div>' +
    '<p style="font-size:12.5px;margin:10px 0 0;font-weight:600">Смотри на линию, а не на точки.</p>' +
    '<p class="dim" style="font-size:12px">Вода, соль и вчерашний ужин двигают точку на ±1.5 кг. Ориентир: 75–76 кг к 24-й неделе.</p>' +
    '<div class="flex" style="margin-top:12px;flex-wrap:nowrap">' +
    '<div class="field" style="flex:1"><span>Вес утром, кг</span><input type="number" step="0.1" inputmode="decimal" id="b-w" placeholder="' + (last ? last.weightKg : 85) + '"></div>' +
    '<div class="field" style="flex:1"><span>Талия, см</span><input type="number" step="0.5" inputmode="decimal" id="b-t" placeholder="' + (waist ? waist.waistCm : "—") + '"></div>' +
    '<button type="button" class="btn pri" id="b-save" style="align-self:flex-end">Записать</button></div></div>';

  h += '<div class="sec-h">Нормативы</div><div class="card"><div class="g2d">' +
    TESTS.map(t => {
      const ser = tests.filter(x => typeof x[t.k] === "number").map(x => ({ v: x[t.k] }));
      const cur = ser.length ? ser[ser.length - 1].v : 0;
      const rec = ser.length ? Math.max.apply(null, ser.map(s => s.v)) : 0;
      return '<div><div class="between"><span style="font-size:13px">' + esc(t.n) + '</span>' +
        '<span class="n" style="font-weight:600">' + cur + ' <span class="dim" style="font-size:10px">' + t.u + '</span></span></div>' +
        '<canvas data-m="' + t.k + '"></canvas>' +
        '<div class="dim" style="font-size:11px">рекорд ' + rec + '</div></div>';
    }).join("") + '</div>' +
    '<button type="button" class="btn sm" id="b-test" style="margin-top:10px">Новый замер</button></div>';

  h += '<div class="sec-h">Активность</div><div class="card"><div class="between" style="margin-bottom:10px">' +
    '<h3>12 недель</h3><span class="pill acc">стрик ' + computeStreak() + '</span></div>' + heatHTML(12) + '</div>';

  h += '<div class="metrics" style="grid-template-columns:repeat(3,1fr)">' +
    metricCell("Тренировок", String(ses.length), "") + metricCell("Подходов", String(sets), "") + metricCell("Повторов", String(reps), "") + '</div>';

  /* рекорды и элементы */
  const recs = {};
  ses.forEach(s => s.exercises.forEach(e => e.sets.forEach(x => {
    if (!x.done) return;
    const v = x.reps != null ? x.reps : x.seconds;
    if (v != null && (!recs[e.name] || v > recs[e.name].v)) recs[e.name] = { v, u: e.unit === "sec" ? "сек" : "повт", d: s.date };
  })));
  const best = names => { let m = 0; Object.keys(recs).forEach(n => { if (names.some(x => n.toLowerCase().indexOf(x) >= 0)) m = Math.max(m, recs[n].v); }); return m; };
  const t0 = tests[tests.length - 1] || {};
  const ACH = [
    ["Первые 5 подтягиваний", Math.max(best(["подтягивания"]), t0.pullups || 0) >= 5],
    ["8 подтягиваний", Math.max(best(["подтягивания"]), t0.pullups || 0) >= 8],
    ["20 отжиманий", Math.max(best(["отжимания от пола"]), t0.pushups || 0) >= 20],
    ["Планка 60 сек", Math.max(best(["планка"]), t0.plankSec || 0) >= 60],
    ["Hollow hold 45 сек", Math.max(best(["hollow hold"]), t0.hollowSec || 0) >= 45],
    ["Tuck front lever 15 сек", Math.max(best(["tuck front lever"]), t0.frontLeverSec || 0) >= 15],
    ["Planche lean 45 сек", best(["planche lean"]) >= 45],
    ["Straddle front lever", best(["straddle front lever"]) >= 8],
    ["Tuck planche 10 сек", best(["tuck planche"]) >= 10],
    ["Первый выход силой", ladderIndex("pull") >= LADDERS.pull.steps.length - 1]
  ];
  h += '<div class="g2d"><div class="card"><h3>Элементы</h3>' +
    ACH.map(a => '<div class="row"><span class="tx"' + (a[1] ? "" : ' style="color:var(--ink-3)"') + '>' + esc(a[0]) + '</span>' +
      (a[1] ? '<span class="pill good">взято</span>' : '<span class="pill">в работе</span>') + '</div>').join("") + '</div>';
  const rk = Object.keys(recs).sort();
  h += '<div class="card"><h3>Рекорды</h3>' + (rk.length ?
    rk.map(n => '<div class="row"><span class="tx">' + esc(n) + '</span><span class="vv">' + recs[n].v + ' <span class="dim" style="font-size:10px">' + recs[n].u + '</span></span></div>').join("")
    : '<p class="dim" style="font-size:13px">Появятся после первой тренировки.</p>') + '</div></div>';

  if (ses.length) h += '<details class="acc"><summary>История тренировок · ' + ses.length + '</summary><div class="in"><div class="scrollx"><table>' +
    '<thead><tr><th>Дата</th><th>День</th><th class="n">Время</th><th class="n">Повт.</th></tr></thead><tbody>' +
    ses.slice().reverse().slice(0, 40).map(s => '<tr><td class="n">' + esc(humanDate(s.date)) + '</td>' +
      '<td>' + s.day + (s.mode === "home" ? " · дом" : "") + (s.deload ? " · разгр." : "") + '</td>' +
      '<td class="n">' + fmtDur(s.durationSec || 0) + '</td>' +
      '<td class="n">' + s.exercises.reduce((m, e) => m + exVolume(e), 0) + '</td></tr>').join("") +
    '</tbody></table></div></div></details>';

  el.innerHTML = h;
  weightChart($("#wc"));
  TESTS.forEach(t => {
    const cv = $('[data-m="' + t.k + '"]', el);
    if (cv) miniChart(cv, tests.filter(x => typeof x[t.k] === "number").map(x => ({ v: x[t.k] })));
  });
  $("#b-save").addEventListener("click", () => {
    const w = +$("#b-w").value, ws = +$("#b-t").value;
    if (!w && !ws) return toast("Нечего сохранять", "bad");
    const t = isoDate();
    let r = state.body.find(x => x.date === t);
    if (!r) { r = { date: t, weightKg: null, waistCm: null }; state.body.push(r); }
    if (w) r.weightKg = round1(w);
    if (ws) r.waistCm = round1(ws);
    state.body.sort((x, y) => x.date < y.date ? -1 : 1);
    maybeRecalcTargets();
    saveState(true); renderBody(); toast("Записано", "good");
  });
  $("#b-test").addEventListener("click", () => modal({
    title: "Замер нормативов",
    html: TESTS.map(t => '<div class="field" style="margin-bottom:8px"><span>' + esc(t.n) + ", " + t.u + '</span>' +
      '<input type="number" inputmode="numeric" id="tt-' + t.k + '" value="' + (t0[t.k] != null ? t0[t.k] : 0) + '"></div>').join(""),
    okText: "Записать",
    collect: b => { const o = { date: isoDate() }; TESTS.forEach(t => o[t.k] = +$("#tt-" + t.k, b).value || 0); return o; }
  }).then(v => {
    if (!v) return;

function setMode(m) {

  toast(m === "home" ? "Дом: +2 подхода жиму и корпусу" : "Площадка: полная программа", "good");
}

/* --- Бэкап --- */
function exportBackup() {
  saveState(true);
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = "trainer-backup-" + isoDate() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("Бэкап скачан", "good");
}
function mergeBy(local, inc, key, prefer) {
  const m = new Map();
  (local || []).forEach(x => m.set(key(x), x));
  (inc || []).forEach(x => { if (!m.has(key(x)) || prefer) m.set(key(x), x); });
  return Array.from(m.values());
}
function importBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(String(r.result)); } catch (e) { return toast("Файл не читается", "bad"); }
    if (!d || !d.meta || !d.profile) return toast("Это не бэкап приложения", "bad");
    const newer = new Date(d.meta.updatedAt || 0) > new Date(state.meta.updatedAt || 0);
    const rows = [["Тренировок", (d.sessions || []).length, state.sessions.length],
      ["Приёмов пищи", (d.meals || []).length, state.meals.length],
      ["Замеров веса", (d.body || []).length, state.body.length]];
    modal({
      title: "Загрузить бэкап",
      html: '<p class="mid" style="font-size:13px">Файл от ' + esc(new Date(d.meta.updatedAt).toLocaleString("ru-RU")) + '. ' +
        (newer ? "Он новее — профиль и ступени возьмутся из него." : "Он старее — настройки останутся местные, добавятся недостающие записи.") + '</p>' +
        '<table><thead><tr><th>Раздел</th><th class="n">В файле</th><th class="n">Сейчас</th></tr></thead><tbody>' +
        rows.map(x => '<tr><td>' + x[0] + '</td><td class="n">' + x[1] + '</td><td class="n">' + x[2] + '</td></tr>').join("") +
        '</tbody></table><p class="dim" style="font-size:12px;margin-top:8px">Слияние, а не перезапись.</p>',
      okText: "Слить"
    }).then(ok => {
      if (!ok) return;
      const i = migrate(d);
      state.sessions = mergeBy(state.sessions, i.sessions, x => x.id, newer).sort((a, b) => a.date < b.date ? -1 : 1);
      state.meals = mergeBy(state.meals, i.meals, x => x.id, newer);
      state.walks = mergeBy(state.walks, i.walks, x => x.date, newer);
      state.water = mergeBy(state.water, i.water, x => x.date, newer);
      state.caffeine = mergeBy(state.caffeine, i.caffeine, x => x.date, newer);
      state.body = mergeBy(state.body, i.body, x => x.date, newer).sort((a, b) => a.date < b.date ? -1 : 1);
      state.tests = mergeBy(state.tests, i.tests, x => x.date, newer).sort((a, b) => a.date < b.date ? -1 : 1);
      state.customFoods = mergeBy(state.customFoods, i.customFoods, x => x.key, newer);
      if (newer) { state.profile = i.profile; state.program = i.program; state.settings = i.settings; state.targets = i.targets; }
      saveState(true); applyTheme(); renderTopbar(); renderScreen(state.ui.tab);
      toast("Бэкап слит", "good", 4500);
    });
  };
  r.readAsText(file);
}
function resetAll() {
  modal({ title: "Сбросить всё", text: "Удалятся тренировки, питание, вес и настройки. Необратимо.", okText: "Дальше", danger: true })
    .then(ok => ok && modal({
      title: "Точно?",
      html: '<p class="mid" style="font-size:13px">Введи слово <b>СБРОС</b>. Перед этим лучше скачать бэкап.</p>' +
        '<div class="field"><input type="text" id="rw" autocomplete="off" aria-label="Подтверждение"></div>',
      okText: "Сбросить", danger: true, collect: b => $("#rw", b).value.trim().toUpperCase()
    }))
    .then(w => {
      if (w !== "СБРОС") return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      state = defaultState();
      saveState(true); applyTheme(); renderTopbar(); showTab("today");
      toast("Сброшено", "good");
    });
}

/* --- Напоминания --- */
let pendingBanners = [];
function askNotify() {
  if (!("Notification" in window)) return toast("Браузер не умеет уведомления — останутся баннеры", "bad");
  Notification.requestPermission().then(p =>
    toast(p === "granted" ? "Уведомления разрешены" : "Разрешения нет — будут баннеры внутри приложения", p === "granted" ? "good" : ""));
}
function notify(title, body) {
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, { body, tag: title }); return; } catch (e) {}
  }
  pendingBanners.push(title + " — " + body);
  if (state.ui.tab === "today") renderToday();
  toast(title + ": " + body, "", 6000);
}
let remTimers = [];
function scheduleReminders() {
  remTimers.forEach(clearTimeout); remTimers = [];
  const r = state.settings.reminders;
  if (!r.enabled) return;
  const plan = dayPlanFor(isoDate());
  const jobs = [
    { t: r.weight, ti: "Записать вес", b: "Утро, натощак — одно число." },
    { t: r.meal, ti: "Отметить еду", b: "Пройдись по дню: что съел и сколько." }
  ];
  if (plan.kind === "train") jobs.push({ t: r.workout, ti: "Тренировка, день " + plan.day, b: "50–60 минут. Разминка обязательна." });
  jobs.forEach(j => {
    const p = String(j.t || "").split(":");
    if (p.length !== 2) return;
    const w = new Date(); w.setHours(+p[0], +p[1], 0, 0);
    const dl = w.getTime() - Date.now();
    if (dl > 0 && dl < 864e5) remTimers.push(setTimeout(() => notify(j.ti, j.b), dl));
  });
}

  const f = FIGURES[name];
  if (!f) return "";
  return '<svg class="fig ' + (cls || "") + '" viewBox="0 0 140 110" role="img" aria-label="Схема упражнения">' + f + '</svg>';
}
function guideFor(exKey) {
  const g = EX_GUIDE[exKey];
  return g ? GUIDES[g] : null;
}
function ytLink(id) { return "https://www.youtube.com/watch?v=" + id; }

function openGuide(gKey) {
  const g = GUIDES[gKey];
  if (!g) return;
  modal({
    title: g.t,
    html: figSVG(g.fig, "big") +
      '<div class="sec-h" style="margin-top:14px">Как делать</div>' +
      '<ul class="cues">' + g.how.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul>' +
      '<div class="sec-h">Частые ошибки</div>' +
      '<ul class="cues err">' + g.err.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul>' +
      (g.v ? '<a class="btn sm" style="margin-top:12px;text-decoration:none;color:var(--ink)" href="' + ytLink(g.v) +
        '" target="_blank" rel="noopener noreferrer">Видео с разбором</a>' : ""),
    okText: "Понятно", cancel: false
  });
}

/* --- Экран «Гид» --- */
function renderLearn() {
  const el = $("#s-learn");
  const keys = Object.keys(GUIDES);
  let h = '<div class="note">' + ic("ic-info", 16) +
    '<div>Схемы нарисованы прямо в приложении, поэтому работают без интернета. Видео открываются на YouTube — ссылки проверены.</div></div>';

  h += '<div class="sec-h">Как делать упражнения</div><div class="figgrid">' +
    keys.map(k => '<button type="button" class="figcard" data-g="' + k + '">' +
      figSVG(GUIDES[k].fig) + '<span>' + esc(GUIDES[k].t) + '</span></button>').join("") + '</div>';

  h += '<div class="sec-h">Видео с разбором техники</div>';
  const groups = [];
  VIDEOS.forEach(v => { if (groups.indexOf(v.g) < 0) groups.push(v.g); });
  groups.forEach(gr => {
    h += '<div class="card"><h3>' + esc(gr) + '</h3>' +
      VIDEOS.filter(v => v.g === gr).map(v =>
        '<a class="lnk" href="' + ytLink(v.id) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="pl">' + ic("ic-play", 16) + '</span>' +
        '<span class="tx"><b>' + esc(v.t) + '</b>' + (v.ru ? ' <span class="pill acc">рус</span>' : "") +
        '<em>' + esc(v.a) + ' · ' + esc(v.d) + '</em></span></a>').join("") + '</div>';
  });

  h += '<div class="sec-h">Каналы, которые стоит листать</div><div class="card">' +
    CHANNELS.map(c => '<a class="lnk" href="https://www.youtube.com/@' + c.h + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="pl">' + ic("ic-play", 16) + '</span><span class="tx"><b>' + esc(c.n) + '</b>' +
      (c.ru ? ' <span class="pill acc">рус</span>' : "") + '<em>' + esc(c.d) + '</em></span></a>').join("") + '</div>';

  h += '<div class="sec-h">Коротко о главном</div>' +
    NOTES_TXT.map(n => '<details class="acc"><summary>' + esc(n.t) + '</summary><div class="in">' +
      '<p class="mid" style="font-size:13.5px;margin:0">' + esc(n.b) + '</p></div></details>').join("");

  el.innerHTML = h;
  $$("[data-g]", el).forEach(b => b.addEventListener("click", () => openGuide(b.dataset.g)));
}

/* --- Диспетчер экранов --- */
function renderScreen(id) {
  charts = [];
  renderTopbar();
  if (id === "today") renderToday();
  else if (id === "workout") renderWorkout();
  else if (id === "food") renderFood();
  else if (id === "body") renderBody();
  else if (id === "learn") renderLearn();
  else if (id === "more") renderMore();
}

function init() {
  buildManifest();
  buildNav();
  applyTheme();
  $("#theme-btn").addEventListener("click", () => {
    const order = ["system", "light", "dark"];
    state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
    saveState(); applyTheme();
    toast(state.settings.theme === "system" ? "Тема: как в системе" : state.settings.theme === "dark" ? "Тема: тёмная" : "Тема: светлая");
  });
  maybeRecalcTargets();
  showTab(state.active ? "workout" : (state.ui.tab || "today"));
  scheduleReminders();
  saveState(true);

  let day = isoDate();
  setInterval(() => {
    if (isoDate() !== day) { day = isoDate(); pendingBanners = []; scheduleReminders(); renderScreen(state.ui.tab); }
  }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderTopbar(); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

</script>

</body>
</html>
